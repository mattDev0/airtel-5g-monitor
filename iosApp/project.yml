name: AirtelMonitor
options:
  bundleIdPrefix: com.airtel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "2.0.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  AirtelMonitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AirtelMonitor
    info:
      path: AirtelMonitor/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airtel.monitor
        INFOPLIST_FILE: AirtelMonitor/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
