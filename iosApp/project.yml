name: AirtelMonitor
options:
  bundleIdPrefix: dev.mattdev0
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: "2.1.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  AirtelMonitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AirtelMonitor
    # No `info:` block on purpose: XcodeGen would regenerate Info.plist from its
    # defaults and silently drop the launch screen (the app then runs letterboxed
    # in legacy mode), the local-network prompt text, ATS and the version numbers.
    # The committed Info.plist is used as-is via INFOPLIST_FILE.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mattdev0.airtelmonitor
        INFOPLIST_FILE: AirtelMonitor/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  AirtelMonitorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AirtelMonitorTests
    dependencies:
      - target: AirtelMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mattdev0.airtelmonitor.tests
